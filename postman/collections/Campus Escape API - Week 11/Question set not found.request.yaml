$kind: http-request
url: "{{baseUrl}}/question-sets/999"
method: GET
headers:
  X-Demo-User: "{{host}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status is 404\", function () {\r

      \  pm.response.to.have.status(404);\r

      });\r

      \r

      pm.test(\"Error is question set not found\", function () {\r

      \  pm.expect(pm.response.json().error.code).to.eql(\"QUESTION_SET_NOT_FOUND\");\r

      });"
    language: text/javascript
order: 8000
