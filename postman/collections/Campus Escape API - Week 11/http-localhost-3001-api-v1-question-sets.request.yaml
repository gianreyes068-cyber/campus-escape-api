$kind: http-request
name: " http://localhost:3001/api/v1/question-sets"
description: ""
url: "{{baseUrl}}/question-sets"
method: POST
headers:
  X-Demo-User: "{{host}}"
body:
  type: json
  content: "{\r

    \  \"title\": \"Campus Escape Basics\",\r

    \  \"description\": \"Demo set for testing.\",\r

    \  \"subject\": \"Campus Escape\",\r

    \  \"grade_level\": \"College\"\r

