$kind: http-request
url: "{{baseUrl}}/question-sets"
method: GET
headers:
  X-Demo-User: "{{player}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status is 403\", function () {\r

      \  pm.response.to.have.status(403);\r

      });\r

      \r

      pm.test(\"Error is forbidden\", function () {\r

      \  pm.expect(pm.response.json().error.code).to.eql(\"FORBIDDEN\");\r

      });"
    language: text/javascript
order: 5000
