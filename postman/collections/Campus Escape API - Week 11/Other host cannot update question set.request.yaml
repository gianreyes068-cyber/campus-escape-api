      \  pm.response.to.have.status(403);\r

      });\r

      \r

      pm.test(\"Error is forbidden\", function () {\r

      \  pm.expect(pm.response.json().error.code).to.eql(\"FORBIDDEN\");\r

      });"
    language: text/javascript
order: 11000
