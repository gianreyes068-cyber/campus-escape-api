$kind: http-request
url: "{{baseUrl}}/question-sets"
method: POST
headers:
  X-Demo-User: "{{host}}"
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \  \"title\": \"Campus Escape Basics\",\r

    \  \"description\": \"Demo set for testing.\",\r

    \  \"subject\": \"Campus Escape\",\r

    \  \"grade_level\": \"College\""
scripts:
  - type: afterResponse
    code: "pm.test(\"Status is 400\", function () {\r

      \  pm.response.to.have.status(400);\r

      });\r

      \r

      pm.test(\"Error is invalid JSON\", function () {\r

      \  pm.expect(pm.response.json().error.code).to.eql(\"INVALID_JSON\");\r

      });"
    language: text/javascript
order: 3000
