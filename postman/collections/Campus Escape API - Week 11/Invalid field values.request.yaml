$kind: http-request
url: "{{baseUrl}}/question-sets"
method: POST
headers:
  X-Demo-User: "{{host}}"
body:
  type: json
  content: "{\r

    \  \"title\": \"x\",\r

    \  \"subject\": 123,\r

    \  \"grade_level\": \"College\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status is 400\", function () {\r

      \  pm.response.to.have.status(400);\r

      });\r

      \r

      pm.test(\"Error is validation failure\", function () {\r

      \  pm.expect(pm.response.json().error.code).to.eql(\"VALIDATION_FAILED\");\r

      });"
    language: text/javascript
order: 2000
